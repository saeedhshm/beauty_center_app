components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Isolated admin-audience Bearer session; no cookies
    MobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token returned in session JSON; no cookie authentication
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken: { type: string, pattern: '^lr_[A-Za-z0-9_-]{43}$' }
  responses:
    Session:
      description: Authenticated session (sensitive response, never log or cache)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    Unauthenticated:
      description: UNAUTHENTICATED for missing, expired, revoked or reused credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: VALIDATION_ERROR with field errors; unrecognized input fields are rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED; durable limits by phone and IP, shared across API processes
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    RequestId:
      description: Server-generated ID; caller-supplied IDs are not trusted
      schema: { type: string, format: uuid }
  schemas:
    Phone:
      type: string
      maxLength: 20
      pattern: '^(?:01[0125]\d{8}|\+201[0125]\d{8})$'
      description: Egyptian mobile number, trimmed and normalized to +201xxxxxxxxx
    LoginPhone:
      type: string
      maxLength: 20
      pattern: '^(?:01[0125]\d{8}|\+201[0125]\d{8}|05\d{8}|\+9665\d{8})$'
      description: Egyptian numbers plus legacy Saudi account login only
    MobileUser:
      type: object
      required: [id, name, phone, role, phoneVerified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, pattern: '^\+(?:201[0125]\d{8}|9665\d{8})$' }
        role: { type: string, enum: [customer, expert] }
        phoneVerified:
          type: boolean
          const: true
          description: Registration challenge passed; in demo mode this is simulated, not proof of phone ownership
    SessionResponse:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string, format: uuid }
        data:
          type: object
          required: [user, tokenType, accessToken, refreshToken, accessExpiresAt, refreshExpiresAt]
          properties:
            user:
              $ref: '#/components/schemas/MobileUser'
            tokenType: { type: string, const: Bearer }
            accessToken: { type: string, pattern: '^la_[A-Za-z0-9_-]{43}$' }
            refreshToken: { type: string, pattern: '^lr_[A-Za-z0-9_-]{43}$' }
            accessExpiresAt: { type: string, format: date-time }
            refreshExpiresAt: { type: string, format: date-time }
    HealthResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok, ready] }
        requestId: { type: string, format: uuid }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [NOT_FOUND, INVALID_JSON, PAYLOAD_TOO_LARGE, UNSUPPORTED_ENCODING, SERVICE_UNAVAILABLE, INTERNAL_ERROR, VALIDATION_ERROR, RATE_LIMITED, OTP_DELIVERY_UNAVAILABLE, INVALID_OTP, PHONE_ALREADY_REGISTERED, INVALID_CREDENTIALS, UNAUTHENTICATED, FORBIDDEN, CONFIGURATION_UNAVAILABLE, CITY_UNAVAILABLE, CITY_IN_USE, CITY_MUST_BE_INACTIVE, LAUNCH_CITY_PROTECTED, EXPERT_NOT_APPROVED, EXPERT_UNAVAILABLE, SERVICE_UNAVAILABLE, SLOT_UNAVAILABLE, SLOT_TAKEN, BOOKING_EXPIRED, INVALID_TRANSITION, PAYMENT_ALREADY_SETTLED, AMOUNT_MISMATCH, INVALID_PROVIDER_TOKEN, BOOKING_ALREADY_PAID_OUT, BOOKING_IN_PAYOUT, ACCOUNT_NOT_FOUND, IDEMPOTENCY_IN_PROGRESS, FILE_REQUIRED, FILE_TOO_LARGE, INVALID_UPLOAD, UNSUPPORTED_FILE_TYPE, MEDIA_LIMIT_REACHED]
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
        requestId: { type: string, format: uuid }
