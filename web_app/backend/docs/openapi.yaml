openapi: 3.1.0
info:
  title: Lamsa Backend API
  version: 0.8.0
  description: >-
    Managed active cities, EGP/SAR market currency and Africa/Cairo time zone,
    mobile and admin authentication,
    catalog, expert approval, customer addresses, editable booking policy,
    expert availability with slots, the booking state machine with history,
    demo payments and refunds, expert payouts, mutual reviews and the
    caller's notification feed with durable push delivery.
    Registration requires an OTP challenge. The MVP defaults to explicit demo delivery
    using code 123456 without SMS or proof of phone ownership. AUTH_OTP_MODE=disabled
    returns OTP_DELIVERY_UNAVAILABLE until a real provider adapter is implemented.
    Tokens are opaque Bearer tokens, not JWTs.
    Readiness checks database connectivity, not business schema completeness.
    All responses use Cache-Control no-store and a server-generated X-Request-ID.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness, independent of PostgreSQL
      responses:
        '200':
          description: HTTP process is running
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: { status: ok }
                requestId: 75727951-3f28-4a21-ad39-56c17f72d603
  /health/ready:
    get:
      operationId: getReadiness
      summary: Execute SELECT 1 through Drizzle and PostgreSQL
      responses:
        '200':
          description: Database connection is available
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data: { status: ready }
                requestId: 75727951-3f28-4a21-ad39-56c17f72d603
        '503':
          description: Database connection unavailable; no connection details are exposed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: الخدمة غير متاحة مؤقتًا
                requestId: 75727951-3f28-4a21-ad39-56c17f72d603
  /api/v1/auth/register/otp:
    post:
      operationId: requestRegistrationOtp
      summary: Send an OTP or request a new one after the cooldown
      description: Does not reveal whether the phone is already registered. No OTP is returned in HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '202':
          description: Sender accepted the request; deliveryMode=demo is simulated and sends no SMS
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    required: [challengeId, expiresAt, retryAfterSeconds, deliveryMode]
                    properties:
                      challengeId: { type: string, format: uuid }
                      expiresAt: { type: string, format: date-time }
                      retryAfterSeconds: { type: integer, const: 60 }
                      deliveryMode: { type: string, enum: [demo, sms] }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: OTP delivery unavailable, including AUTH_OTP_MODE=disabled without a provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      operationId: registerMobileAccount
      summary: Verify OTP and create the user and session atomically
      description: Expert registration also creates a pending profile with booking intake disabled. Admin registration is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, challengeId, otp, name, password, role]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                challengeId: { type: string, format: uuid }
                otp: { type: string, pattern: '^\d{6}$' }
                name: { type: string, minLength: 2, maxLength: 100 }
                password: { type: string, format: password, minLength: 12, maxLength: 128 }
                role: { type: string, enum: [customer, expert] }
      responses:
        '201':
          $ref: '#/components/responses/Session'
        '400':
          description: INVALID_OTP (wrong phone/code, expired, exhausted, undelivered or consumed challenge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PHONE_ALREADY_REGISTERED, disclosed only after a valid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      operationId: loginMobileAccount
      summary: Login using a verified phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, password]
              properties:
                phone:
                  $ref: '#/components/schemas/LoginPhone'
                password: { type: string, format: password, minLength: 1, maxLength: 128 }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          description: INVALID_CREDENTIALS for wrong credentials, inactive, unverified, or unsupported admin accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/refresh:
    post:
      operationId: refreshMobileSession
      summary: Rotate refresh and access tokens
      description: >-
        Serialize refresh calls on the client. Reusing an old refresh token revokes its
        entire session, including tokens issued by a concurrent successful refresh.
        The absolute refreshExpiresAt is not extended. Old access tokens stop working.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      operationId: logoutMobileSession
      summary: Revoke the refresh token's session and its access token
      description: Idempotent; accepts even a consumed refresh token for revocation. Does not require an unexpired access token.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '204':
          description: Session revoked or token unknown; no body
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/password/otp:
    post:
      operationId: requestPasswordRecoveryOtp
      summary: Send an OTP for password recovery
      description: Same challenge machinery as registration with separate rate buckets. Does not reveal whether the phone has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '202':
          description: Challenge accepted; deliveryMode=demo is simulated and sends no SMS
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    required: [challengeId, expiresAt, retryAfterSeconds, deliveryMode]
                    properties:
                      challengeId: { type: string, format: uuid }
                      expiresAt: { type: string, format: date-time }
                      retryAfterSeconds: { type: integer, const: 60 }
                      deliveryMode: { type: string, enum: [demo, sms] }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: OTP delivery unavailable, including AUTH_OTP_MODE=disabled without a provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password/reset:
    post:
      operationId: resetPasswordByOtp
      summary: Verify OTP and rotate the password, revoking every session
      description: No session is issued; the client logs in again explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, challengeId, otp, newPassword]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                challengeId: { type: string, format: uuid }
                otp: { type: string, pattern: '^\d{6}$' }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '204':
          description: Password rotated and all sessions revoked; no body
        '400':
          description: INVALID_OTP (wrong phone/code, expired, exhausted, undelivered or consumed challenge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ACCOUNT_NOT_FOUND when no account holds the verified phone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/password/change:
    post:
      operationId: changeOwnPassword
      summary: Change the password with the current one; ends every session
      security:
        - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, minLength: 1, maxLength: 128 }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '204':
          description: Password rotated and all sessions revoked including the current one; log in again
        '401':
          description: INVALID_CREDENTIALS for a wrong current password, or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/phone/otp:
    post:
      operationId: requestPhoneChangeOtp
      summary: Send an OTP to a new phone number before adopting it
      description: Separate rate buckets from registration. Does not reveal whether the phone is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '202':
          description: Challenge accepted; deliveryMode=demo is simulated and sends no SMS
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    required: [challengeId, expiresAt, retryAfterSeconds, deliveryMode]
                    properties:
                      challengeId: { type: string, format: uuid }
                      expiresAt: { type: string, format: date-time }
                      retryAfterSeconds: { type: integer, const: 60 }
                      deliveryMode: { type: string, enum: [demo, sms] }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: OTP delivery unavailable, including AUTH_OTP_MODE=disabled without a provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/phone/change:
    post:
      operationId: changeOwnPhone
      summary: Adopt a verified new phone number; sessions stay valid
      security:
        - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, challengeId, otp]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
                challengeId: { type: string, format: uuid }
                otp: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Updated account with the verified number
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    $ref: '#/components/schemas/MobileUser'
        '400':
          description: INVALID_OTP (wrong phone/code, expired, exhausted, undelivered or consumed challenge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: PHONE_ALREADY_REGISTERED when another account holds the number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/users/me:
    get:
      operationId: getOwnAccount
      summary: Return only the authenticated account's allowlisted fields
      security:
        - MobileBearer: []
      responses:
        '200':
          description: Current account, never selected by a caller-supplied userId
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    $ref: '#/components/schemas/MobileUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      operationId: patchOwnAccount
      summary: Edit the account name or launch city
      security:
        - MobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                cityId: { type: integer, minimum: 1, maximum: 32767 }
      responses:
        '200':
          description: Updated account fields including cityId
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/MobileUser'
                      - type: object
                        properties:
                          cityId: { type: [integer, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: CITY_UNAVAILABLE when the city is outside the active launch scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/users/me/deactivate:
    post:
      operationId: deactivateOwnAccount
      summary: Deactivate the current account and revoke every session
      description: Financial and booking history is preserved; the account simply stops authenticating.
      security:
        - MobileBearer: []
      responses:
        '204':
          description: Account deactivated; no body
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/experts/me:
    patch:
      operationId: updateOwnExpertProfile
      security: [{ MobileBearer: [] }]
      requestBody:
        $ref: './catalog.openapi.yaml#/paths/~1api~1v1~1experts~1me/patch/requestBody'
      responses:
        '200':
          $ref: './catalog.openapi.yaml#/components/responses/ExpertProfile'
        default:
          $ref: './catalog.openapi.yaml#/components/responses/Error'
    get:
      operationId: getOwnExpertProfile
      summary: Read own expert approval status and profile without private document keys
      security:
        - MobileBearer: []
      responses:
        '200':
          description: Current expert profile, including pending or suspended approval state
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string, format: uuid }
                  data:
                    type: object
                    required: [userId, name, cityId, bio, approvalStatus, isAcceptingBookings]
                    properties:
                      userId: { type: string, format: uuid }
                      name: { type: string }
                      cityId: { type: [integer, 'null'] }
                      bio: { type: [string, 'null'] }
                      approvalStatus: { type: string, enum: [pending, approved, suspended] }
                      isAcceptingBookings: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: FORBIDDEN for customer accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Expert profile is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
