name: lamsa-backend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lamsa_local
      POSTGRES_PASSWORD: lamsa_local
      POSTGRES_DB: lamsa_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lamsa_local -d lamsa_dev']
      interval: 2s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: lamsa_test
      POSTGRES_PASSWORD: lamsa_test
      POSTGRES_DB: lamsa_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lamsa_test -d lamsa_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dev-data:
